{% extends "base.html" %}

{% block title %}
Edit Student | CampusConnect
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                <i class="bi bi-pencil-square text-warning"></i>

                Edit Student

            </h2>

            <p class="text-muted mb-0">

                Update student information.

            </p>

        </div>

        <a
            href="{{ url_for('student.student_list') }}"
            class="btn btn-outline-primary">

            <i class="bi bi-arrow-left"></i>

            Back to Students

        </a>

    </div>

    <form
        method="POST"
        enctype="multipart/form-data"
        action="{{ url_for('student.update_student', rollno=student.rollno) }}">

        <div class="row">

            <!-- LEFT -->

            <div class="col-lg-8">

                <div class="card shadow-sm mb-4">

                    <div class="card-header bg-white">

                        <h5 class="mb-0">

                            Personal Information

                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="row g-3">

                            <div class="col-md-6">

                                <label class="form-label">

                                    Student Name

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="name"
                                    value="{{ student.name }}"
                                    required>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">

                                    Roll Number

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    value="{{ student.rollno }}"
                                    readonly>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">

                                    Email

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    name="email"
                                    value="{{ student.email }}">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">

                                    Phone

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="phone"
                                    value="{{ student.phone }}">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">

                                    Parent Phone

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="parent_phone"
                                    value="{{ student.parent_phone }}">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">

                                    Blood Group

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="blood_group"
                                    value="{{ student.blood_group }}">

                            </div>

                        </div>

                    </div>

                </div>

                <div class="card shadow-sm">

                    <div class="card-header bg-white">

                        <h5 class="mb-0">

                            Academic Information

                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="row g-3">

                            <div class="col-md-4">

                                <label class="form-label">

                                    Department

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="department"
                                    value="{{ student.department }}">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label">

                                    Year

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="year"
                                    value="{{ student.year }}">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label">

                                    Section

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="section"
                                    value="{{ student.section }}">

                            </div>

                            <div class="col-12">

                                <label class="form-label">

                                    Address

                                </label>

                                <textarea
                                    class="form-control"
                                    rows="4"
                                    name="address">{{ student.address }}</textarea>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- RIGHT -->

            <div class="col-lg-4">

                <div class="card shadow-sm">

                    <div class="card-header bg-white">

                        <h5 class="mb-0">

                            Student Photo

                        </h5>

                    </div>

                    <div class="card-body text-center">

                        <img
                            id="preview"
                            src="{{ url_for('static', filename='photos/' + student.photo) }}"
                            class="rounded-circle shadow mb-3"
                            style="width:180px;height:180px;object-fit:cover;">

                        <input
                            type="file"
                            class="form-control"
                            id="photo"
                            name="photo">

                        <button
                            type="submit"
                            class="btn btn-warning w-100 mt-4">

                            <i class="bi bi-check-circle-fill"></i>

                            Update Student

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </form>

</div>

{% endblock %}

{% block js %}

<script>

const photo = document.getElementById("photo");

const preview = document.getElementById("preview");

photo.onchange = function () {

    if (this.files.length) {

        preview.src = URL.createObjectURL(this.files[0]);

    }

}

</script>

{% endblock %}
