{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Change Password</h2>

    <form method="POST">

        <div class="mb-3">
            <label for="current_password">Current Password</label>
            <input
                type="password"
                name="current_password"
                id="current_password"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label for="new_password">New Password</label>
            <input
                type="password"
                name="new_password"
                id="new_password"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label for="confirm_password">Confirm New Password</label>
            <input
                type="password"
                name="confirm_password"
                id="confirm_password"
                class="form-control"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Change Password
        </button>

        <a href="{{ url_for('admin.settings') }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
